# R740 Production ingress only. The edge joins both app networks; Production backend,
# migrator and frontend remain on their own default network. Unique upstream aliases
# prevent the shared generic "backend"/"frontend" names from selecting the wrong DB.
services:
  caddy:
    build:
      dockerfile: Dockerfile.caddy-edge
    environment:
      PUBLIC_PROD_DOMAIN: ${PUBLIC_PROD_DOMAIN:?Set the reviewed public Production domain}
      PUBLIC_UAT_DOMAIN: ${PUBLIC_UAT_DOMAIN:?Set the reviewed public UAT domain}
    networks:
      - default
      - uat_ingress
    secrets:
      - source: duckdns-token
        target: duckdns-token

networks:
  uat_ingress:
    external: true
    name: saleapp-uat_default

secrets:
  duckdns-token:
    file: ${SALEAPP_DUCKDNS_TOKEN_FILE:?Use the protected Production token file}
