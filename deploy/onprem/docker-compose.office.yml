# On-prem against the office SQL Server (owner 2026-10-09): Caddy (HTTPS) + API + web on the Ubuntu VM.
# No SQL Server container: the API works in the WINSpeed database at the office over the LAN/VPN (DB_MODE=onprem,
# see backend/onprem-target.js). Settings: .env (copy .env.office.example). Setup steps: office-setup.sh.
#
#   docker compose -f docker-compose.office.yml up -d --build                      start / update
#   docker compose -f docker-compose.office.yml --profile migrate run --rm migrate --plan   migration plan (read-only)
#   docker compose -f docker-compose.office.yml --profile migrate run --rm migrate          apply migrations
#   docker compose -f docker-compose.office.yml exec backend node scripts/onprem-preflight.cjs   connection check
services:

  caddy:
    image: caddy:2-alpine
    container_name: wf-caddy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      TZ: ${TZ:-Asia/Bangkok}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data          # certificates; keep this volume, Let's Encrypt rate-limits new ones
      - caddy-config:/config
    depends_on:
      - frontend
      - backend
    networks: [wf-net]

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: wf-backend:office
    container_name: wf-backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: ${TZ:-Asia/Bangkok}
      DB_MODE: onprem
      # go-live checklist A4 / PERM-07: no coupon posting into WINSpeed; admin-set passwords must be changed
      COUPON_NATIVE_POSTING_ENABLED: "false"
      ENFORCE_PASSWORD_CHANGE: "true"
      EXPORT_OUTPUT_PATH: /app/exports
    volumes:
      - backend-exports:/app/exports
      - backend-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [wf-net]

  # one-off migration runner with the migrator login, kept out of the running API (.env.migrator.local)
  migrate:
    image: wf-backend:office
    profiles: ["migrate"]
    env_file:
      - .env
      - .env.migrator.local
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Asia/Bangkok}
      DB_MODE: onprem
      DB_OPERATION: migration
      MIGRATION_PROFILE: onprem
      COUPON_NATIVE_POSTING_ENABLED: "false"
    entrypoint: ["node", "run_migrations.js"]
    networks: [wf-net]

  # VITE_API_BASE_URL is baked in at build time: rebuild after changing the domain
  frontend:
    build:
      context: ../../WSSale-App
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: wf-frontend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Bangkok}
    depends_on:
      backend:
        condition: service_healthy
    networks: [wf-net]

volumes:
  backend-exports:
  backend-uploads:
  caddy-data:
  caddy-config:

networks:
  wf-net:
    driver: bridge
