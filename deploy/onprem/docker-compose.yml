# On-prem Docker: Caddy, SQL Server, API and frontend. See docs/DEPLOYMENT.md.
services:

  # ── Reverse proxy + TLS อัตโนมัติ ───────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: wf-caddy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      API_DOMAIN: ${API_DOMAIN:-localhost:3000}
      TZ: ${TZ:-Asia/Bangkok}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data          # เก็บใบรับรอง — อย่าลบ ไม่งั้นต้องขอใหม่ (มี rate limit)
      - caddy-config:/config
    depends_on:
      - frontend
      - backend
    networks: [wf-net]

  # ── SQL Server (WINSpeed) ───────────────────────────────────
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: wf-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: ${MSSQL_PID:-Express}        # Express ฟรี จำกัด 10GB/DB (วัดจริง 3.37GB → พอ)
      MSSQL_COLLATION: Thai_CI_AS             # ต้องตรงกับ dbwins_worldfert9
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB:-2048}
      TZ: ${TZ:-Asia/Bangkok}
    ports:
      - "127.0.0.1:${MSSQL_LOCAL_PORT:-1433}:1433"   # loopback เท่านั้น
    volumes:
      - mssql-data:/var/opt/mssql
      - ./backup:/var/opt/mssql/backup              # วางไฟล์ .bak ที่โฟลเดอร์นี้
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: ${MSSQL_MEM_LIMIT:-3G}
    networks: [wf-net]

  # ── Backend ─────────────────────────────────────────────────
  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: wf-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: ${TZ:-Asia/Bangkok}
      # ⚠ โค้ดไม่รู้จัก DB_HOST/DB_PORT — ต้องใช้ชื่อพวกนี้เท่านั้น
      DB_MODE: remote
      REMOTE_DB_SERVER: mssql
      REMOTE_DB_PORT: 1433
      REMOTE_DB_USER: sa
      REMOTE_DB_PASSWORD: ${MSSQL_SA_PASSWORD}
      DB_NAME: ${DB_NAME:-dbwins_worldfert9}
      DB_USER: wf_reader
      DB_PASSWORD: ${WF_READER_PASSWORD}
      DB_OWNER_USER: wf_owner
      DB_OWNER_PASSWORD: ${WF_OWNER_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGIN: ${CORS_ORIGIN}
      EXPORT_OUTPUT_PATH: /app/exports
      MIGRATE_SECRET: ${MIGRATE_SECRET}
      # LINE Login (ไม่ใส่ก็ใช้งานได้ ยกเว้นปุ่ม Login with LINE) — ดู ../LINE-LOGIN-GUIDE.md
      LINE_LOGIN_CHANNEL_ID: ${LINE_LOGIN_CHANNEL_ID:-}
      LINE_LOGIN_CHANNEL_SECRET: ${LINE_LOGIN_CHANNEL_SECRET:-}
      LINE_LOGIN_CALLBACK_URL: ${LINE_LOGIN_CALLBACK_URL:-}
      LINE_LOGIN_SUCCESS_REDIRECT: ${LINE_LOGIN_SUCCESS_REDIRECT:-}
    volumes:
      - backend-exports:/app/exports
    depends_on:
      mssql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [wf-net]

  # ── Frontend ────────────────────────────────────────────────
  # ⚠ VITE_API_BASE_URL ถูก bake ตอน build → เปลี่ยนโดเมนแล้วต้อง --build ใหม่
  frontend:
    build:
      context: ../../WSSale-App
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: wf-frontend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Bangkok}
    depends_on:
      backend:
        condition: service_healthy
    networks: [wf-net]

volumes:
  mssql-data:
  backend-exports:
  caddy-data:
  caddy-config:

networks:
  wf-net:
    driver: bridge
