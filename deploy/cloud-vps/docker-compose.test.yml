name: worldfert-test

# Test application only. MSSQL and MySQL remain in the production Compose
# project, but these containers connect exclusively to separately named test
# databases. They share the existing Docker network so no database port needs
# to be added.
services:
  backend-test:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: wf-backend-test
    restart: unless-stopped
    environment:
      NODE_ENV: test
      APP_ENV: test
      PORT: 3000
      TZ: ${TZ:-Asia/Bangkok}
      DB_MODE: remote
      REMOTE_DB_SERVER: mssql
      REMOTE_DB_PORT: 1433
      REMOTE_DB_USER: sa
      REMOTE_DB_PASSWORD: ${MSSQL_SA_PASSWORD}
      DB_NAME: ${MSSQL_TEST_DATABASE}
      DB_USER: wf_reader
      DB_PASSWORD: ${WF_READER_PASSWORD}
      DB_OWNER_USER: wf_owner
      DB_OWNER_PASSWORD: ${WF_OWNER_PASSWORD}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_TEST_DATABASE}
      MYSQL_USER: ${MYSQL_USER:-wfapp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_SSL_CA_PATH: /app/secrets/mysql-ca.crt
      DEFAULT_SEED_PASSWORD: ""
      JWT_SECRET: ${TEST_JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGIN: ${TEST_CORS_ORIGIN}
      EXPORT_OUTPUT_PATH: /app/exports
      MIGRATE_SECRET: ${TEST_MIGRATE_SECRET}
      TS_INGEST_SECRET: ${TEST_TS_INGEST_SECRET}
      TS_SYNC_INTERVAL_MS: ${TS_SYNC_INTERVAL_MS:-60000}
      APP_VERSION: ${APP_VERSION:-1.0.0}-test
      DISABLE_BACKGROUND_WORKERS: "true"
      DISABLE_EXTERNAL_INTEGRATIONS: "true"
      ALERT_WEBHOOK_URL: ""
      LINE_CHANNEL_SECRET: ""
      LINE_CHANNEL_ACCESS_TOKEN: ""
      LINE_LOGIN_CHANNEL_ID: ""
      LINE_LOGIN_CHANNEL_SECRET: ""
      LINE_LOGIN_CALLBACK_URL: ""
      LINE_LOGIN_SUCCESS_REDIRECT: ""
    volumes:
      - backend-test-exports:/app/exports
      - backend-test-uploads:/app/uploads
      - ${MYSQL_CERT_DIR:-/opt/worldfert/secrets/mysql}/ca.crt:/app/secrets/mysql-ca.crt:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://localhost:3000/api/health').then(r=>r.json()).then(j=>process.exit(j.ok===true&&j.db?.sqlserver==='up'&&j.db?.mysql==='up'?0:1)).catch(()=>process.exit(1))
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: ${TEST_BACKEND_MEM_LIMIT:-1G}
    networks: [production-net]

  frontend-test:
    build:
      context: ../../WSSale-App
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${TEST_VITE_API_BASE_URL}
        VITE_APP_ENV: test
        VITE_ENVIRONMENT_LABEL: TEST SYSTEM
    container_name: wf-frontend-test
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Bangkok}
    depends_on:
      backend-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: ${TEST_FRONTEND_MEM_LIMIT:-256M}
    networks: [production-net]

volumes:
  backend-test-exports:
  backend-test-uploads:

networks:
  production-net:
    external: true
    name: ${PRODUCTION_NETWORK_NAME:-worldfert_wf-net}
