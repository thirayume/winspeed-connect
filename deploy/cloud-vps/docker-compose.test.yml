name: worldfert-test

# Test application only. MSSQL remains in the production Compose
# project, but these containers connect exclusively to separately named test
# databases. They share the existing Docker network so no database port needs
# to be added.
services:
  backend-test:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: wf-backend-test
    restart: unless-stopped
    environment:
      NODE_ENV: test
      APP_ENV: test
      PORT: 3000
      TZ: ${TZ:-Asia/Bangkok}
      DB_MODE: remote
      # ปลายทางฐานของ test ตั้งค่าได้ · ไม่ตั้ง = ใช้คอนเทนเนอร์บน VPS เหมือนเดิม
      # ตั้ง TEST_MSSQL_SERVER ให้ชี้ Azure ได้เมื่ออยากให้ test ตรงกับ WINSpeed ที่หน้างานใช้
      REMOTE_DB_SERVER: ${TEST_MSSQL_SERVER:-mssql}
      REMOTE_DB_PORT: ${TEST_MSSQL_PORT:-1433}
      REMOTE_DB_USER: sa
      REMOTE_DB_PASSWORD: ${MSSQL_SA_PASSWORD}
      # ไม่มีค่าปริยายมาก่อน — ถ้า .env ไม่ได้ตั้ง ชื่อฐานจะว่างแล้วต่อไม่ติดแบบเงียบ ๆ
      DB_NAME: ${MSSQL_TEST_DATABASE:-dbwins_worldfert9_test}
      DB_USER: wf_reader
      DB_PASSWORD: ${WF_READER_PASSWORD}
      DB_OWNER_USER: wf_owner
      DB_OWNER_PASSWORD: ${WF_OWNER_PASSWORD}
      DEFAULT_SEED_PASSWORD: ""
      JWT_SECRET: ${TEST_JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGIN: ${TEST_CORS_ORIGIN}
      EXPORT_OUTPUT_PATH: /app/exports
      MIGRATE_SECRET: ${TEST_MIGRATE_SECRET}
      TS_INGEST_SECRET: ${TEST_TS_INGEST_SECRET}
      TS_SYNC_INTERVAL_MS: ${TS_SYNC_INTERVAL_MS:-60000}
      # กันไม่ให้ test เขียนทับฐานเครื่องชั่งของจริง (assertWritableTarget)
      # ประกาศไว้ใน .env.example ตั้งแต่แรกแต่ไม่เคยส่งเข้าคอนเทนเนอร์ ตัวกันจึงไม่เคยทำงาน
      TS_PRODUCTION_HOSTS: ${TS_PRODUCTION_HOSTS:-}
      APP_VERSION: ${APP_VERSION:-1.0.0}-test
      DISABLE_BACKGROUND_WORKERS: "true"
      DISABLE_EXTERNAL_INTEGRATIONS: "true"
      ALERT_WEBHOOK_URL: ""
      LINE_CHANNEL_SECRET: ""
      LINE_CHANNEL_ACCESS_TOKEN: ""
      LINE_LOGIN_CHANNEL_ID: ""
      LINE_LOGIN_CHANNEL_SECRET: ""
      LINE_LOGIN_CALLBACK_URL: ""
      LINE_LOGIN_SUCCESS_REDIRECT: ""
    volumes:
      - backend-test-exports:/app/exports
      - backend-test-uploads:/app/uploads
    # ⚠ healthcheck เคยบังคับ db.mysql === 'up' ด้วย
    #   พอถอด MySQL ออกทั้งระบบเมื่อ 5 ก.ย. 2569 เงื่อนไขนี้เป็นจริงไม่ได้อีก
    #   คอนเทนเนอร์ UAT จึงขึ้น unhealthy ติดต่อกัน 3 วัน (FailingStreak 1658)
    #   ทั้งที่ตัวแอปเองตอบ ok:true ตามปกติ — เป็นเงื่อนไขที่ค้าง ไม่ใช่แอปพัง
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://localhost:3000/api/health').then(r=>r.json()).then(j=>process.exit(j.ok===true&&j.db?.sqlserver==='up'?0:1)).catch(()=>process.exit(1))
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: ${TEST_BACKEND_MEM_LIMIT:-1G}
    networks: [production-net]

  frontend-test:
    build:
      context: ../../WSSale-App
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${TEST_VITE_API_BASE_URL}
        VITE_APP_ENV: test
        VITE_ENVIRONMENT_LABEL: TEST SYSTEM
    container_name: wf-frontend-test
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Bangkok}
    depends_on:
      backend-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: ${TEST_FRONTEND_MEM_LIMIT:-256M}
    networks: [production-net]

volumes:
  backend-test-exports:
  backend-test-uploads:

networks:
  production-net:
    external: true
    name: ${PRODUCTION_NETWORK_NAME:-worldfert_wf-net}
