name: worldfert

services:
  caddy:
    image: caddy:2-alpine
    container_name: wf-caddy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      ROOT_DOMAIN: ${ROOT_DOMAIN}
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      PORTAINER_DOMAIN: ${PORTAINER_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      TZ: ${TZ:-Asia/Bangkok}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
      portainer:
        condition: service_started
    networks: [wf-net]

  portainer:
    image: portainer/portainer-ce:lts
    container_name: wf-portainer
    command:
      - -H
      - unix:///var/run/docker.sock
      - --admin-password-file
      - /run/secrets/portainer_admin_password
      - --trusted-origins
      - https://${PORTAINER_DOMAIN}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
      - ${PORTAINER_ADMIN_PASSWORD_FILE:-/opt/worldfert/secrets/portainer/admin-password}:/run/secrets/portainer_admin_password:ro
    networks: [wf-net]

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: wf-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: ${MSSQL_PID:-Express}
      MSSQL_COLLATION: Thai_CI_AS
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB:-6144}
      TZ: ${TZ:-Asia/Bangkok}
    ports:
      - "${DB_BIND_IP:-0.0.0.0}:${MSSQL_PUBLIC_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
      - ${TRANSFER_ROOT:-/srv/wf-transfer}/incoming/mssql:/var/opt/mssql/backup/incoming:ro
      - ${TRANSFER_ROOT:-/srv/wf-transfer}/work/mssql:/var/opt/mssql/backup/work
      - ${MSSQL_CERT_DIR:-/opt/worldfert/secrets/mssql}:/var/opt/mssql/secrets:ro
      - ${MSSQL_CONFIG_FILE:-/opt/worldfert/secrets/mssql/mssql.conf}:/var/opt/mssql/mssql.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 12
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: ${MSSQL_MEM_LIMIT:-8G}
    networks: [wf-net]

  mysql:
    image: mysql:8.0
    container_name: wf-mysql
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+07:00
      - --innodb-buffer-pool-size=${MYSQL_BUFFER_POOL:-1G}
      - --require-secure-transport=ON
      - --ssl-ca=/etc/mysql/certs/ca.crt
      - --ssl-cert=/etc/mysql/certs/server.crt
      - --ssl-key=/etc/mysql/certs/server.key
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-db_truckscale}
      MYSQL_USER: ${MYSQL_USER:-wfapp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: ${TZ:-Asia/Bangkok}
    ports:
      - "${DB_BIND_IP:-0.0.0.0}:${MYSQL_PUBLIC_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ${TRANSFER_ROOT:-/srv/wf-transfer}/incoming/mysql:/backup/incoming:ro
      - ${MYSQL_CERT_DIR:-/opt/worldfert/secrets/mysql}:/etc/mysql/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --ssl-mode=REQUIRED --silent || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: ${MYSQL_MEM_LIMIT:-2G}
    networks: [wf-net]

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: wf-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: ${TZ:-Asia/Bangkok}
      DB_MODE: remote
      REMOTE_DB_SERVER: mssql
      REMOTE_DB_PORT: 1433
      REMOTE_DB_USER: sa
      REMOTE_DB_PASSWORD: ${MSSQL_SA_PASSWORD}
      DB_NAME: ${DB_NAME:-dbwins_worldfert9}
      DB_USER: wf_reader
      DB_PASSWORD: ${WF_READER_PASSWORD}
      DB_OWNER_USER: wf_owner
      DB_OWNER_PASSWORD: ${WF_OWNER_PASSWORD}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-db_truckscale}
      MYSQL_USER: ${MYSQL_USER:-wfapp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_SSL_CA_PATH: /app/secrets/mysql-ca.crt
      DEFAULT_SEED_PASSWORD: ${DEFAULT_SEED_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGIN: ${CORS_ORIGIN}
      EXPORT_OUTPUT_PATH: /app/exports
      MIGRATE_SECRET: ${MIGRATE_SECRET}
      TS_SYNC_INTERVAL_MS: ${TS_SYNC_INTERVAL_MS:-60000}
      TS_INGEST_SECRET: ${TS_INGEST_SECRET}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      LINE_LOGIN_CHANNEL_ID: ${LINE_LOGIN_CHANNEL_ID:-}
      LINE_LOGIN_CHANNEL_SECRET: ${LINE_LOGIN_CHANNEL_SECRET:-}
      LINE_LOGIN_CALLBACK_URL: ${LINE_LOGIN_CALLBACK_URL:-}
      LINE_LOGIN_SUCCESS_REDIRECT: ${LINE_LOGIN_SUCCESS_REDIRECT:-}
    volumes:
      - backend-exports:/app/exports
      - ${MYSQL_CERT_DIR:-/opt/worldfert/secrets/mysql}/ca.crt:/app/secrets/mysql-ca.crt:ro
    depends_on:
      mssql:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 45s
    networks: [wf-net]

  frontend:
    build:
      context: ../../WSSale-App
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: wf-frontend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Bangkok}
    depends_on:
      backend:
        condition: service_healthy
    networks: [wf-net]

volumes:
  mssql-data:
  mysql-data:
  backend-exports:
  caddy-data:
  caddy-config:
  portainer-data:

networks:
  wf-net:
    driver: bridge
