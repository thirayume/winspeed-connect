# UAT-only clone stack for a Linux container host. For production use the reviewed
# On-Premise release topology and its separate approval gates.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: ${TZ:-Asia/Bangkok}
      DB_MODE: onprem
      ONPREM_DB_SERVER: ${ONPREM_DB_SERVER:?Set ONPREM_DB_SERVER in the local .env}
      ONPREM_DB_PORT: ${ONPREM_DB_PORT:-}
      ONPREM_DB_INSTANCE: ${ONPREM_DB_INSTANCE:-}
      ONPREM_DB_NAME: ${ONPREM_DB_NAME:?Set ONPREM_DB_NAME to the approved UAT clone}
      ONPREM_EXPECTED_SERVERNAME: ${ONPREM_EXPECTED_SERVERNAME:?Set the verified SQL @@SERVERNAME}
      ONPREM_PRODUCT_VERSION_PREFIX: ${ONPREM_PRODUCT_VERSION_PREFIX:-10.50.}
      ONPREM_DB_USER: ${ONPREM_DB_USER:?Use a dedicated non-sa application login}
      ONPREM_DB_ENCRYPT: ${ONPREM_DB_ENCRYPT:-true}
      ONPREM_DB_LEGACY_TLS: ${ONPREM_DB_LEGACY_TLS:-false}
      JWT_SECRET: ${JWT_SECRET:?Generate a private JWT_SECRET in the local .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set the browser origin used to open the app}
      ENFORCE_PASSWORD_CHANGE: "true"
      COUPON_NATIVE_POSTING_ENABLED: "false"
      DISABLE_BACKGROUND_WORKERS: "true"
      EXPORT_OUTPUT_PATH: /app/exports
    volumes:
      - backend-exports:/app/exports
      - backend-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./WSSale-App
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in the local .env}
      TZ: ${TZ:-Asia/Bangkok}
    volumes:
      - ./docs/deploy/onprem/Caddyfile.uat:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  backend-exports:
  backend-uploads:
  caddy-data:
  caddy-config:
