# UAT-only clone stack for a Linux container host. For production use the reviewed
# On-Premise release topology and its separate approval gates.
# SALEAPP_STACK names the images so stacks on one host (R740 uat/prod, each its own
# Compose project) never share an image; it defaults to the local UAT2 names.
services:
  backend:
    image: worldfert-saleapp-${SALEAPP_STACK:-uat}-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: ${TZ:-Asia/Bangkok}
      DB_MODE: onprem
      ONPREM_DB_SERVER: ${ONPREM_DB_SERVER:?Set ONPREM_DB_SERVER in the local .env}
      ONPREM_DB_PORT: ${ONPREM_DB_PORT:-}
      ONPREM_DB_INSTANCE: ${ONPREM_DB_INSTANCE:-}
      ONPREM_DB_NAME: ${ONPREM_DB_NAME:?Set ONPREM_DB_NAME to the approved UAT clone}
      ONPREM_EXPECTED_SERVERNAME: ${ONPREM_EXPECTED_SERVERNAME:?Set the verified SQL @@SERVERNAME}
      ONPREM_PRODUCT_VERSION_PREFIX: ${ONPREM_PRODUCT_VERSION_PREFIX:-10.50.}
      ONPREM_DB_USER: ${ONPREM_DB_USER:?Use a dedicated non-sa application login}
      ONPREM_DB_PASSWORD: ${ONPREM_DB_PASSWORD:?Set ONPREM_DB_PASSWORD in the local .env}
      ONPREM_DB_ENCRYPT: ${ONPREM_DB_ENCRYPT:-true}
      ONPREM_DB_LEGACY_TLS: ${ONPREM_DB_LEGACY_TLS:-false}
      ONPREM_TARGET_KIND: ${ONPREM_TARGET_KIND:-uat}
      JWT_SECRET: ${JWT_SECRET:?Generate a private JWT_SECRET in the local .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set the browser origin used to open the app}
      ENFORCE_PASSWORD_CHANGE: "true"
      COUPON_NATIVE_POSTING_ENABLED: "false"
      # Polling (screen refresh) and the outbox worker; neither writes dbo. Off unless a
      # target turns them on (R740 UAT/PROD: owner 2026-10-24).
      DISABLE_BACKGROUND_WORKERS: ${DISABLE_BACKGROUND_WORKERS:-true}
      # Initial-only UAT2 AI contract. Disabled until explicitly enabled for local UAT.
      NATIVE_BOOKING_AI_ENABLED: ${NATIVE_BOOKING_AI_ENABLED:-false}
      NATIVE_DELIVERY_104_ENABLED: ${NATIVE_DELIVERY_104_ENABLED:-false}
      EXPORT_OUTPUT_PATH: /app/exports
    volumes:
      - backend-exports:/app/exports
      - backend-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "healthcheck.cjs"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # One-off UAT migration runner. The deploy wrapper runs a read-only plan first,
  # applies only pending changes on the pinned UAT target, then verifies the ledger.
  # It receives the dedicated migrator secret; API credentials/JWT are never passed here.
  migrate:
    image: worldfert-saleapp-${SALEAPP_STACK:-uat}-backend:local
    profiles: ["migrate"]
    env_file:
      - ${SALEAPP_MIGRATOR_ENV_FILE:-.env.migrator.local}
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Asia/Bangkok}
      DB_MODE: onprem
      DB_OPERATION: migration
      MIGRATION_PROFILE: onprem
      ONPREM_DB_SERVER: ${ONPREM_DB_SERVER:?Set ONPREM_DB_SERVER in the local .env}
      ONPREM_DB_PORT: ${ONPREM_DB_PORT:-}
      ONPREM_DB_INSTANCE: ${ONPREM_DB_INSTANCE:-}
      ONPREM_DB_NAME: ${ONPREM_DB_NAME:?Set ONPREM_DB_NAME in the local .env}
      ONPREM_EXPECTED_SERVERNAME: ${ONPREM_EXPECTED_SERVERNAME:?Set the verified SQL @@SERVERNAME}
      ONPREM_PRODUCT_VERSION_PREFIX: ${ONPREM_PRODUCT_VERSION_PREFIX:-10.50.}
      ONPREM_DB_ENCRYPT: ${ONPREM_DB_ENCRYPT:-true}
      ONPREM_DB_LEGACY_TLS: ${ONPREM_DB_LEGACY_TLS:-false}
      ONPREM_TARGET_KIND: ${ONPREM_TARGET_KIND:-uat}
      ONPREM_DB_TDS_VERSION: ${ONPREM_DB_TDS_VERSION:-7_3_B}
      COUPON_NATIVE_POSTING_ENABLED: "false"
    entrypoint: ["node", "run_migrations.js"]

  frontend:
    image: worldfert-saleapp-${SALEAPP_STACK:-uat}-frontend:local
    build:
      context: ./WSSale-App
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: worldfert-saleapp-${SALEAPP_STACK:-uat}-caddy:local
    build:
      context: ./docs/deploy/onprem
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:${HTTP_PORT:-8080}"
      - "${HTTPS_PORT:-8444}:${HTTPS_PORT:-8444}"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in the local .env}
      HTTP_PORT: ${HTTP_PORT:-8080}
      HTTPS_PORT: ${HTTPS_PORT:-8444}
      TZ: ${TZ:-Asia/Bangkok}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

volumes:
  backend-exports:
  backend-uploads:
  caddy-data:
  caddy-config:
