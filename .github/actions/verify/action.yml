# The checks CI runs, for the promotion workflows: they test the exact tree they are about
# to push (a merge result that exists only in the runner) before any branch moves.
name: verify
description: Backend tests, frontend build with typecheck, and the repository hygiene checks.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: '22'

    - name: Backend dependencies
      shell: bash
      working-directory: backend
      run: npm ci

    - name: Backend tests
      shell: bash
      working-directory: backend
      run: npm test

    - name: Rebate authoritative price regression
      shell: bash
      working-directory: backend
      run: node --test tests/rebate-price-authority.test.js tests/rebate-booking-proof.test.js tests/rebate-booking-snapshot.test.js tests/rebate-booking-decisions.test.js tests/rebate-booking-approval.test.js tests/rebate-booking-transaction.test.js tests/rebate-booking-route.test.js tests/rebate-shipment-booking-snapshot.test.js tests/rebate-shipment-lots.test.js tests/rebate-shipment-queue.test.js tests/rebate-shipment-queue-route.test.js tests/rebate-shared-queue-scope.test.js tests/rebate-pool-pipeline.test.js tests/rebate-evidence-scope.test.js tests/rebate-evidence-route.test.js tests/rebate-evidence-discovery.test.js tests/rebate-evidence-discovery-runner.test.js tests/rebate-evidence-discovery-worker.test.js tests/rebate-ticket-redemption-plan.test.js tests/rebate-ticket-booking-proof.test.js tests/rebate-ticket-redemption-transaction.test.js tests/rebate-ticket-treatment-proposal.test.js tests/rebate-draft-mode.test.js tests/price-approval-lock.test.js

    - name: Global data window tests
      shell: bash
      working-directory: backend
      run: node --test tests/data-window.test.js tests/global-data-window-routes.test.js tests/report-data-window.test.js tests/trip-data-window.test.js tests/trip-create-window.test.js tests/so-data-window.test.js tests/confirmation-replay-data-window.test.js tests/so-schema-cache.test.js tests/pricebook-sync-transaction.test.js tests/pricebook-special-atomic.test.js tests/quotation-data-window.test.js tests/incidents-data-window.test.js tests/weighing-data-window.test.js tests/edit-requests-data-window.test.js tests/recon-data-window.test.js tests/giveaway-data-window.test.js tests/giveaway-withdrawal-window.test.js tests/master-history-data-window.test.js tests/master-schema-cache.test.js tests/budget-data-window.test.js tests/rebate-pool-data-window.test.js tests/rebate-accrual-data-window.test.js tests/rebate-posting-safety.test.js tests/rebate-snapshot-safety.test.js tests/rebate-snapshot-transaction.test.js tests/rebate-cycle-policy.test.js tests/rebate-conversion-execution.test.js tests/rebate-conversion-route.test.js tests/rebate-shared-fifo.test.js tests/rebate-shared-conversion.test.js tests/rebate-reset-targets.test.js tests/rebate-reset-preflight.test.js tests/rebate-reset-begin.test.js tests/rebate-reset-recover.test.js tests/rebate-reset-fence.test.js tests/rebate-participant-fence.test.js tests/rebate-reset-participant-apply.test.js tests/rebate-evidence-policy.test.js tests/rebate-evidence-intake.test.js tests/rebate-evidence-review.test.js tests/rebate-evidence-flow.test.js tests/rebate-verified-shipment.test.js tests/rebate-shipment-accrual.test.js tests/rebate-shipment-reservation.test.js tests/rebate-shipment-fifo.test.js tests/rebate-shipment-conversion.test.js tests/rebate-shipment-claim-allocation.test.js tests/rebate-shipment-claim.test.js tests/rebate-shipment-claim-route.test.js tests/rebate-shipment-claim-decision-route.test.js tests/rebate-shipment-claim-verification.test.js tests/rebate-claim-replay.test.js tests/rebate-route-fence.test.js tests/rebate-pool-feature-switch.test.js tests/rebate-reset-initialize.test.js tests/rebate-reset-initialize-route.test.js tests/rebate-reset-epoch.test.js tests/rebate-shipment-source.test.js tests/rebate-sql.test.js tests/database-identity-binding.test.js tests/database-identity-resolver.test.js tests/database-identity-registry.test.js tests/database-identity-registry-routes.test.js tests/business-identity.test.js tests/papertrail-business-identity.test.js tests/auth-primary-anchor.test.js tests/auth-role-intersection.test.js tests/request-context-database.test.js tests/user-sync-transaction.test.js tests/approval-identity.test.js tests/rebate-approval-identity.test.js

    - name: Offline migration rehearsal
      shell: bash
      working-directory: backend
      run: npm run test:rehearsal:offline

    - name: Frontend dependencies
      shell: bash
      working-directory: WSSale-App
      run: npm ci

    # build = tsc -b && vite build, so it covers the typecheck (tsc --noEmit checks nothing here).
    - name: Frontend build (with typecheck)
      shell: bash
      working-directory: WSSale-App
      run: npm run build

    - name: Browser regression dependencies
      shell: bash
      run: |
        npm ci
        npx playwright install --with-deps chromium

    - name: Loading and admin console browser regressions
      shell: bash
      run: npm run test:resilience

    - name: Data-window browser regressions
      shell: bash
      run: npx playwright test --config e2e/playwright.giveaway-date-review.config.ts

    - name: Batch files are ASCII only
      shell: bash
      run: |
        bad=$(grep -rlP '[\x80-\xFF]' --include='*.bat' --include='*.cmd' . || true)
        if [ -n "$bad" ]; then echo "::error::non-ASCII bytes in batch files:"; echo "$bad"; exit 1; fi

    - name: Deploy shell scripts parse
      shell: bash
      run: |
        for f in docs/deploy/onprem/wsl-deploy.sh docs/deploy/r740/bootstrap.sh docs/deploy/r740/r740-deploy.sh; do
          bash -n "$f"
        done

    - name: Compose version used by R740 deployment guards
      uses: docker/setup-compose-action@v2
      with:
        version: v5.6.1

    - name: Deployment config and redacted diagnostics
      shell: bash
      run: python3 scripts/test-wsl-deploy-config.py

    - name: No secret files tracked
      shell: bash
      run: |
        leak=$(git ls-files | grep -E '(^|/)(remote-config\.bat|\.local-secrets/|.*\.pem$|server-config\.env$)' || true)
        if [ -n "$leak" ]; then echo "::error::files that must not be tracked:"; echo "$leak"; exit 1; fi
